name: Deploy Keiba Strategy Lab
on:
  push:
    branches: [main]
    paths:
      - 'keiba-strategy-lab-v*-github-pages.zip'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract browser app
        run: |
          mkdir -p extracted site
          unzip -q keiba-strategy-lab-v1-github-pages.zip -d extracted
          cp -a extracted/keiba-strategy-lab-v1/dist/. site/
      - name: Validate syntax and calculations
        working-directory: extracted/keiba-strategy-lab-v1
        run: |
          node --check dist/app.js
          node --check dist/engine.js
          node --check dist/worker.js
          node --test tests/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
